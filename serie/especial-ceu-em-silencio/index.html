<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: #06080D; }
  body { font-family: 'Inter', sans-serif; color: #F2F3F5; -webkit-font-smoothing: antialiased; }
  .mono { font-family: 'DejaVu Sans Mono', monospace; }
  #stage { position: absolute; inset: 0; overflow: hidden; }
  .bg { position: absolute; inset: 0;
    background: radial-gradient(900px 700px at 50% 38%, rgba(45,127,249,var(--glow,0)) 0%, rgba(0,0,0,0) 70%),
                radial-gradient(1200px 900px at 50% 40%, #10141D 0%, #06080D 70%); }
  .grid { position: absolute; inset: 0; opacity: .45;
    background-image: linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px);
    background-size: 60px 60px; -webkit-mask-image: radial-gradient(ellipse at 50% 40%, #000 30%, transparent 75%); }
  .vignette { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 45%, transparent 55%, rgba(0,0,0,.6) 100%); pointer-events:none; }
  #header { position: absolute; top: 120px; left: 90px; right: 90px; }
  .kicker { font-weight: 800; font-size: 34px; letter-spacing: 6px; color: #F5B83D; }
  .sub { font-weight: 600; font-size: 28px; letter-spacing: 4px; color: rgba(255,255,255,.45); margin-top: 10px; }
  .rec { display:inline-block; width: 14px; height: 14px; border-radius: 50%; background:#FF4747; margin-right: 14px; vertical-align: 3px; box-shadow: 0 0 14px #FF4747; }
  .bars { display: flex; gap: 10px; margin-top: 30px; }
  .bar { flex: 1; height: 8px; border-radius: 4px; background: rgba(255,255,255,.1); overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0%; background: #F5B83D; border-radius: 4px; }
  #root { position: absolute; inset: 0; }
  .layer { position: absolute; inset: 0; }
  .w { display: inline-block; }
  .line { text-align: center; white-space: nowrap; }
  .mid { font-weight: 800; font-size: 82px; letter-spacing: -2px; line-height: 1.12; }
  .small { font-weight: 600; font-size: 46px; line-height: 1.3; }
  .dim { color: rgba(255,255,255,.55); }
  .hl-blue { color: #4C9BFF; } .hl-red { color: #FF4D4D; } .hl-green { color: #3DDC84; } .hl-amber { color: #F5B83D; }
  #subs { position: absolute; left: 70px; right: 70px; top: 1500px; text-align: center; }
  #subs span { display: inline-block; font-weight: 800; font-size: 46px; line-height: 1.25; padding: 14px 26px; border-radius: 16px; background: rgba(0,0,0,.55); color: #fff; }
  .notif { position: absolute; left: 90px; right: 90px; height: 170px; border-radius: 34px; background: rgba(38,42,54,.92); border: 2px solid rgba(255,255,255,.08); display:flex; align-items:center; gap: 30px; padding: 0 36px; box-shadow: 0 20px 60px rgba(0,0,0,.5); }
  .notif .ic { width: 96px; height: 96px; border-radius: 24px; display:flex; align-items:center; justify-content:center; font-size: 56px; font-weight: 900; color:#fff; flex: none; }
  .notif .tt { font-weight: 800; font-size: 38px; }
  .notif .bd { font-weight: 500; font-size: 32px; color: rgba(255,255,255,.7); margin-top: 6px; }
  .notif .tm { position:absolute; right: 34px; top: 26px; font-size: 26px; color: rgba(255,255,255,.4); }
  .pill { display:inline-block; font-weight: 800; font-size: 44px; padding: 26px 46px; border-radius: 999px; }
  .tag { display:inline-block; font-family: 'DejaVu Sans Mono', monospace; font-size: 30px; letter-spacing: 3px; padding: 12px 22px; border-radius: 12px; border: 2px solid rgba(255,255,255,.18); color: rgba(255,255,255,.75); background: rgba(255,255,255,.04); }
</style>
</head>
<body>
<div id="stage">
  <div class="bg" id="bg"></div>
  <div class="grid"></div>
  <canvas id="map" width="960" height="420" style="position:absolute;left:60px;top:0;opacity:0"></canvas>
  <div id="root"></div>
  <div id="header">
    <div class="kicker"><span class="rec"></span>BUGS QUE CUSTARAM CARO</div>
    <div class="sub">ESPECIAL · O CÉU EM SILÊNCIO</div>
    <div class="bars" id="bars"></div>
  </div>
  <div id="subs"></div>
  <div class="vignette"></div>
</div>
<script>

const clamp = (x, a=0, b=1) => Math.min(b, Math.max(a, x));
const prog = (t, a, d) => clamp((t - a) / d);
const easeOut = x => 1 - Math.pow(1 - x, 3);
const easeIO = x => x < .5 ? 4*x*x*x : 1 - Math.pow(-2*x + 2, 3)/2;
const back = x => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3*Math.pow(x-1,3) + c1*Math.pow(x-1,2); };
const fmt = n => n.toLocaleString('pt-BR');
const pad = n => String(n).padStart(2, '0');
function rnd(i) { const x = Math.sin(i * 12.9898 + 78.233) * 43758.5453; return x - Math.floor(x); }
function pop(t, a, dur=.38) { const p = prog(t, a, dur), e = back(p); return `opacity:${clamp(p*2.2)};transform:translateY(${(1-e)*40}px) scale(${.85+.15*e});`; }
function words(t, spec, start, step, cls='') {
  return `<div class="line ${cls}">` + spec.map((w,i) => { const [txt,c] = Array.isArray(w) ? w : [w,'']; return `<span class="w ${c}" style="${pop(t, start+i*step)}">${txt}</span>`; }).join(' ') + `</div>`;
}
const root = document.getElementById('root');


// ===== Ilustrações animadas (todas originais, desenhadas em código) =====
function R(i) { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }

// avião comercial genérico, visto de lado (frente para a direita). w = largura em px
function airliner(w, t, opts = {}) {
  const night = opts.night !== false;
  const body = night ? '#AEB6C3' : '#E3E7EE', wing = night ? '#8C95A3' : '#C3CAD5', win = night ? '#FFD98A' : '#2B3445';
  const blink = Math.floor(t * 1.6 + (opts.phase || 0)) % 2 === 0;
  const strobe = (t * 1.1 + (opts.phase || 0)) % 1 < .08;
  let windows = '';
  for (let x = 150; x < 455; x += 17) windows += `<rect x="${x}" y="98" width="7" height="9" rx="3" fill="${win}" opacity="${night ? .95 : .8}"/>`;
  return `<svg width="${w}" height="${w / 3}" viewBox="0 0 600 200" style="overflow:visible">
    <defs><linearGradient id="fus${opts.id || 0}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${body}"/><stop offset="1" stop-color="${night ? '#6E7684' : '#AAB2BE'}"/></linearGradient></defs>
    <path d="M62 112 L8 121 L24 127 L96 118 Z" fill="${wing}"/>
    <path d="M70 94 L28 22 L62 22 L120 92 Z" fill="${wing}"/>
    <path d="M40 110 Q58 88 122 87 L468 87 Q545 89 578 108 Q548 127 468 128 L122 128 Q60 128 40 110 Z" fill="url(#fus${opts.id || 0})"/>
    <path d="M536 96 Q556 99 566 106 L540 106 Z" fill="#1E2633"/>
    ${windows}
    <rect x="122" y="112" width="346" height="4" fill="${opts.stripe || '#22C7F2'}" opacity=".8"/>
    <path d="M250 120 L372 120 L312 182 L278 182 Z" fill="${wing}"/>
    <ellipse cx="316" cy="152" rx="40" ry="15" fill="#7C8594"/><ellipse cx="352" cy="152" rx="6" ry="13" fill="#2A3240"/>
    <circle cx="30" cy="24" r="6" fill="#FF3B3B" opacity="${blink ? 1 : .15}"/>
    ${blink ? '<circle cx="30" cy="24" r="22" fill="#FF3B3B" opacity=".25"/>' : ''}
    <circle cx="300" cy="86" r="5" fill="#FF3B3B" opacity="${blink ? .2 : 1}"/>
    <circle cx="312" cy="182" r="5" fill="#fff" opacity="${strobe ? 1 : .2}"/>
    ${strobe ? '<circle cx="312" cy="182" r="40" fill="#fff" opacity=".35"/>' : ''}
  </svg>`;
}

// céu noturno com estrelas, nuvens e cidade
function nightSky(t, opts = {}) {
  let stars = '';
  for (let i = 0; i < 90; i++) {
    const tw = .35 + .65 * Math.abs(Math.sin(t * (1 + R(i) * 2) + i));
    stars += `<i style="position:absolute;left:${R(i) * 1080}px;top:${R(i + 300) * 1100}px;width:${2 + R(i + 9) * 3}px;height:${2 + R(i + 9) * 3}px;border-radius:50%;background:#fff;opacity:${tw * .8}"></i>`;
  }
  let clouds = '';
  for (let i = 0; i < 6; i++) {
    const x = ((R(i + 40) * 1500 - t * (20 + R(i) * 40) * (opts.cloudSpeed || 1)) % 1500 + 1500) % 1500 - 300;
    clouds += `<div style="position:absolute;left:${x}px;top:${250 + R(i + 60) * 900}px;width:${300 + R(i + 5) * 300}px;height:${70 + R(i + 7) * 60}px;border-radius:50%;background:rgba(160,150,220,.10);filter:blur(18px)"></div>`;
  }
  let city = '';
  for (let i = 0; i < 26; i++) {
    const w = 30 + R(i + 80) * 60, h = 80 + R(i + 90) * 260; const x = i * 42 - 10;
    city += `<div style="position:absolute;left:${x}px;bottom:0;width:${w}px;height:${h}px;background:#07080F"></div>`;
    for (let k = 0; k < 6; k++) if (R(i * 7 + k) > .45) city += `<i style="position:absolute;left:${x + 6 + R(i + k) * (w - 14)}px;bottom:${10 + R(i * 3 + k) * (h - 20)}px;width:5px;height:7px;background:#FFC86B;opacity:${.5 + .5 * R(i + k + 3)}"></i>`;
  }
  return `<div style="position:absolute;inset:0;background:linear-gradient(180deg,#04060F 0%,#0D0B2A 45%,#2A1840 78%,#4A2238 100%)">${stars}${clouds}
    <div style="position:absolute;left:0;right:0;bottom:0;height:420px">${city}</div>
    <div style="position:absolute;left:0;right:0;bottom:400px;height:120px;background:linear-gradient(180deg,transparent,rgba(255,140,90,.12))"></div></div>`;
}

// torre de controle ao entardecer
function tower(t, zoom) {
  const dish = (t * 120) % 360;
  return `<div style="position:absolute;inset:0;overflow:hidden">
    <div style="position:absolute;inset:0;transform:scale(${zoom});transform-origin:540px 700px">
      ${nightSky(t, { cloudSpeed: .5 })}
      <div style="position:absolute;left:460px;top:760px;width:160px;height:1200px;background:linear-gradient(90deg,#0B0D16,#141826,#0B0D16)"></div>
      <div style="position:absolute;left:380px;top:600px;width:320px;height:170px;background:#10131D;clip-path:polygon(0 0,100% 0,88% 100%,12% 100%)"></div>
      <div style="position:absolute;left:400px;top:620px;width:280px;height:90px;background:linear-gradient(180deg,#3DDC84,#1A6B44);opacity:.55;clip-path:polygon(0 0,100% 0,92% 100%,8% 100%)"></div>
      ${[0, 1, 2, 3].map(i => `<div style="position:absolute;left:${430 + i * 60}px;top:630px;width:40px;height:60px;background:rgba(255,255,255,.08)"></div>`).join('')}
      <div style="position:absolute;left:350px;top:580px;width:380px;height:26px;background:#0A0C14"></div>
      <div style="position:absolute;left:530px;top:520px;width:20px;height:60px;background:#0A0C14"></div>
      <div style="position:absolute;left:480px;top:500px;width:120px;height:26px;background:#1A1F2E;border-radius:13px;transform:rotateY(${dish}deg)"></div>
      <circle></circle>
      <div style="position:absolute;left:534px;top:490px;width:12px;height:12px;border-radius:50%;background:#FF3B3B;opacity:${Math.floor(t * 1.5) % 2 ? 1 : .2};box-shadow:0 0 20px #FF3B3B"></div>
    </div></div>`;
}

// pista em perspectiva com aviões parados na fila
function runway(t, frozen) {
  let lights = '';
  for (let i = 0; i < 14; i++) {
    const k = i / 13, y = 1000 + k * k * 900; const spread = 60 + k * 520;
    const on = Math.floor(t * 4 - i * .3) % 3 !== 0 || frozen;
    lights += `<i style="position:absolute;left:${540 - spread}px;top:${y}px;width:${6 + k * 10}px;height:${6 + k * 10}px;border-radius:50%;background:#FFE7A0;opacity:${on ? .9 : .3};box-shadow:0 0 12px #FFD27A"></i>
               <i style="position:absolute;left:${540 + spread}px;top:${y}px;width:${6 + k * 10}px;height:${6 + k * 10}px;border-radius:50%;background:#FFE7A0;opacity:${on ? .9 : .3};box-shadow:0 0 12px #FFD27A"></i>`;
  }
  let dashes = '';
  for (let i = 0; i < 10; i++) { const k = ((i / 10) + (frozen ? 0 : t * .3)) % 1; const y = 1000 + k * k * 900; dashes += `<i style="position:absolute;left:${540 - (3 + k * 10)}px;top:${y}px;width:${6 + k * 20}px;height:${12 + k * 50}px;background:rgba(255,255,255,.7)"></i>`; }
  let planes = '';
  [[60, 960, 300], [200, 1050, 380], [-40, 1190, 480]].forEach(([x, y, w], i) => {
    planes += `<div style="position:absolute;left:${x}px;top:${y}px">${airliner(w, t, { phase: i * .37, id: 10 + i })}</div>`;
  });
  return `<div style="position:absolute;inset:0;overflow:hidden">
    ${nightSky(t, { cloudSpeed: .3 })}
    <div style="position:absolute;left:0;right:0;top:980px;bottom:0;background:#090A10"></div>
    <div style="position:absolute;left:0;right:0;top:980px;height:940px;background:#14161F;clip-path:polygon(47% 0,53% 0,100% 100%,0 100%)"></div>
    ${dashes}${lights}${planes}
  </div>`;
}

// ===== Especial: o céu em silêncio (ground stop nos EUA, 13/11/2026) =====
let PH = [0, 2.20, 4.85, 7.24, 8.70, 10.54, 12.52, 13.60, 17.34, 22.36, 25.43, 28.62, 33.75, 35.16, 41.80, 46.80, 51.22, 56.63];
let END = 59.9;
const TXT = ['Quatro mil aviões no céu.', 'E o controle aéreo começa a perder a voz.', 'Nesta sexta, nos Estados Unidos.', 'Volta dez minutos.',
  'Você é controlador de voo.', 'Você chama um piloto no rádio...', 'Silêncio.', 'Tenta de novo. Nada. E o radar começa a falhar.',
  'E não é só na sua sala: os centros de controle do país inteiro foram afetados.', 'Ataque? Foi a primeira pergunta de todo mundo.',
  'A ordem chega: nenhum avião decola no país.', 'Mais de quatro horas sem decolagens. Mais de dez mil voos afetados.', 'E não foi ataque.',
  'Segundo o governo, equipamentos antigos, que estavam sendo atualizados, não aguentaram uma sobrecarga de dados.',
  'Ou seja: a atualização que ia melhorar o sistema pode ter sido o que o derrubou.',
  'E no seu sistema: você sabe o que acontece quando ele recebe mais do que aguenta?'];
let S = [];
function buildScenes() {
  const c = i => PH[i] - .2;
  S = [[0, c(2)], [c(2), c(3)], [c(3), c(8)], [c(8), c(10)], [c(10), c(12)], [c(12), c(15)], [c(15), c(16)], [c(16), END + 1.6]];
  window.SCENES = S;
}
buildScenes();
const barsEl = document.getElementById('bars');
function buildBars() { barsEl.innerHTML = ''; S.slice(1).forEach(() => { const b = document.createElement('div'); b.className = 'bar'; b.innerHTML = '<i></i>'; barsEl.appendChild(b); }); }
buildBars();
window.setTiming = (ph, end) => { PH = ph; END = end; buildScenes(); buildBars(); };
document.getElementById('map').style.display = 'none';

function subs(t) {
  for (let i = 0; i < TXT.length; i++) {
    const a = PH[i] - .1, b = (i + 1 < PH.length ? PH[i + 1] : END) - .15;
    if (t >= a && t < b) { const o = Math.min(prog(t, a, .12), clamp((b - t) / .12)); return `<span style="opacity:${o}">${TXT[i]}</span>`; }
  }
  return '';
}

// ---------- US dot map ----------
const USP = [[-124.7,48.4],[-123.9,46.2],[-124.3,42],[-122.4,37.8],[-120.6,34.6],[-117.1,32.5],[-111,31.3],[-106.5,31.8],[-104.5,29.6],[-103,29],[-101.4,29.8],[-99.5,27.5],[-97.4,25.9],[-97.3,27.8],[-94,29.7],[-89.6,29.2],[-89.2,30.3],[-85.6,30.1],[-84,30],[-82.6,27.5],[-81.2,25.3],[-80.4,25.3],[-80,26.8],[-81.4,30.7],[-80.9,32.1],[-77.9,33.9],[-75.5,35.2],[-76,37],[-75.9,38.3],[-74,39.5],[-74,40.6],[-71.9,41.3],[-70,41.7],[-70.8,42.9],[-70,43.8],[-67,44.8],[-68.3,47.3],[-69.2,47.4],[-71.5,45],[-75,45],[-76.8,43.6],[-79.1,43.3],[-79.1,42.8],[-82.7,41.7],[-83.5,42.1],[-82.4,43],[-82.5,45.3],[-84.6,46.5],[-88,48.2],[-89.6,48],[-95.2,49],[-123,49]];
const USX = lon => 80 + (lon + 125) / 59 * 920, USY = lat => 40 + (50 - lat) / 26 * 560;
function inP(x, y, p) { let c = false; for (let i = 0, j = p.length - 1; i < p.length; j = i++) { const [xi, yi] = p[i], [xj, yj] = p[j]; if (((yi > y) != (yj > y)) && (x < (xj - xi) * (y - yi) / (yj - yi) + xi)) c = !c; } return c; }
const UDOTS = [];
for (let lat = 49.5; lat >= 24.5; lat -= .75) for (let lon = -124.5; lon <= -66.5; lon += .75) if (inP(lon, lat, USP)) UDOTS.push([USX(lon), USY(lat)]);
const ARTCC = [[47.3,-122.3],[37.7,-122.2],[34.6,-118.1],[40.8,-111.9],[40.2,-105.1],[35.2,-106.6],[44.6,-93.2],[38.9,-94.8],[32.8,-97.1],[29.9,-95.3],[41.8,-88.3],[39.7,-86.3],[35.1,-89.9],[33.4,-84.3],[30.4,-81.8],[25.8,-80.3],[41.3,-82.2],[40.8,-73.1],[39.1,-77.5],[42.7,-71.5]];
function rnd2(i) { const x = Math.sin(i * 91.3 + 7.1) * 43758.5; return x - Math.floor(x); }
// usMap: top offset, planes (0..1 visibility), centersRed fraction 0..1, freeze (planes stop)
function usMap(t, top, planes, red, opts = {}) {
  let h = `<div style="position:absolute;left:0;top:${top}px;width:1080px;height:640px">`;
  h += UDOTS.map(([x, y]) => `<i style="position:absolute;left:${x}px;top:${y}px;width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.14)"></i>`).join('');
  ARTCC.forEach(([la, lo], i) => {
    const x = USX(lo), y = USY(la); const th = rnd2(i + 3) * .9; const on = red >= th; const k = on ? clamp((red - th) / .08) : 0;
    const pulse = .5 + .5 * Math.sin(t * 6 + i);
    h += `<div style="position:absolute;left:${x - 14}px;top:${y - 14}px;width:28px;height:28px;border-radius:50%;background:${on ? '#FF4D4D' : '#3DDC84'};box-shadow:0 0 ${on ? 18 + 14 * pulse : 12}px ${on ? '#FF4D4D' : '#3DDC84'};opacity:.95"></div>`;
    if (on && opts.rings) h += `<div style="position:absolute;left:${x - 40}px;top:${y - 40}px;width:80px;height:80px;border-radius:50%;border:3px solid rgba(255,77,77,${.6 * (1 - ((t * 1.5 + i * .3) % 1))});transform:scale(${.4 + ((t * 1.5 + i * .3) % 1)})"></div>`;
  });
  if (planes > 0) for (let i = 0; i < 46; i++) {
    const sp = .015 + rnd2(i) * .02, ang = rnd2(i + 50) * 6.283;
    const tt = opts.freeze != null ? Math.min(t, opts.freeze) : t;
    const bx = 120 + rnd2(i + 100) * 820, by = 80 + rnd2(i + 200) * 480;
    const x = bx + Math.cos(ang) * (tt * sp * 60 % 120 - 60), y = by + Math.sin(ang) * (tt * sp * 60 % 120 - 60);
    h += `<div style="position:absolute;left:${x}px;top:${y}px;font-size:26px;color:${opts.planeColor || '#F5B83D'};opacity:${planes * (opts.fadePlanes != null ? opts.fadePlanes : 1)};transform:rotate(${ang}rad)">✈</div>`;
  }
  return h + '</div>';
}

// radar scope
function radar(t, glitch, blipsOn) {
  const ang = (t * 140) % 360;
  let blips = '';
  for (let i = 0; i < 16; i++) {
    const r = 80 + rnd2(i + 9) * 250, a = rnd2(i + 31) * 6.283; const x = 380 + Math.cos(a) * r, y = 380 + Math.sin(a) * r;
    const vis = blipsOn * (glitch > 0 ? (rnd2(i + Math.floor(t * 10)) > glitch ? 1 : 0) : 1);
    blips += `<div style="position:absolute;left:${x - 9}px;top:${y - 9}px;width:18px;height:18px;border-radius:50%;background:#3DDC84;box-shadow:0 0 14px #3DDC84;opacity:${vis}"></div>
      <div class="mono" style="position:absolute;left:${x + 14}px;top:${y - 12}px;font-size:18px;color:rgba(61,220,132,.7);opacity:${vis}">${(100 + Math.floor(rnd2(i + 70) * 900))}</div>`;
  }
  const jx = glitch > 0 ? (rnd2(Math.floor(t * 20)) - .5) * 30 * glitch : 0;
  return `<div style="position:absolute;left:160px;top:600px;width:760px;height:760px;border-radius:50%;background:radial-gradient(circle, #0B2416 0%, #06140D 70%);border:4px solid rgba(61,220,132,.45);overflow:hidden;transform:translateX(${jx}px)">
    ${[1, 2, 3].map(k => `<div style="position:absolute;left:${380 - k * 120}px;top:${380 - k * 120}px;width:${k * 240}px;height:${k * 240}px;border-radius:50%;border:2px solid rgba(61,220,132,.18)"></div>`).join('')}
    <div style="position:absolute;inset:0;background:conic-gradient(from ${ang}deg, rgba(61,220,132,.35) 0deg, rgba(61,220,132,0) 50deg, transparent 360deg);opacity:${1 - glitch * .7}"></div>
    ${blips}
    ${glitch > 0 ? `<div style="position:absolute;left:0;right:0;top:${rnd2(Math.floor(t * 15)) * 700}px;height:40px;background:rgba(255,255,255,.08)"></div>` : ''}
  </div>`;

function tracker(t, top, opts = {}) {
  let svg = `<svg width="1080" height="640" style="position:absolute;left:0;top:${top}px;overflow:visible">`;
  let planes = '';
  ROUTES.forEach(([a, b, off, sp], i) => {
    const x1 = USX(a[1]), y1 = USY(a[0]), x2 = USX(b[1]), y2 = USY(b[0]);
    const mx = (x1 + x2) / 2, my = (y1 + y2) / 2 - Math.hypot(x2 - x1, y2 - y1) * .3;
    const tt = opts.freeze != null ? Math.min(t, opts.freeze) : t;
    const p = ((tt * sp + off) % 1);
    svg += `<path d="M${x1} ${y1} Q${mx} ${my} ${x2} ${y2}" fill="none" stroke="rgba(245,184,61,.12)" stroke-width="3"/>`;
    svg += `<path d="M${x1} ${y1} Q${mx} ${my} ${x2} ${y2}" pathLength="1" fill="none" stroke="${opts.red ? '#FF4D4D' : '#F5B83D'}" stroke-width="4" stroke-dasharray="${p} 1" opacity=".75"/>`;
    const q = 1 - p; const x = q * q * x1 + 2 * q * p * mx + p * p * x2, y = q * q * y1 + 2 * q * p * my + p * p * y2;
    const dx = 2 * q * (mx - x1) + 2 * p * (x2 - mx), dy = 2 * q * (my - y1) + 2 * p * (y2 - my);
    planes += `<div style="position:absolute;left:${x - 18}px;top:${top + y - 20}px;font-size:36px;color:#fff;text-shadow:0 0 12px ${opts.red ? '#FF4D4D' : '#F5B83D'};transform:rotate(${Math.atan2(dy, dx)}rad)">✈</div>`;

  return usMap(t, top, 0, opts.redCenters || 0, { rings: !!opts.redCenters }) + svg + '</svg>' + planes;

          <div style="position:absolute;left:${x - 16}px;top:${top + y - 18}px;font-size:30px;color:#fff;transform:rotate(${a + Math.PI / 2}rad)">✈</div>`;
  });

}

  }

  root.innerHTML = h;
  document.getElementById('header').style.opacity = headerO;
  const subEl = document.getElementById('subs');
  subEl.innerHTML = sc === 7 ? '' : subs(t);
  subEl.style.top = subTop + 'px';
  const sx = shake ? Math.sin(t * 90) * shake : 0, sy = shake ? Math.cos(t * 73) * shake : 0;
  root.style.transform = `translate(${sx}px,${sy}px)`;
  document.getElementById('bg').style.setProperty('--glow', glow);
}
window.render = render;
render(0);

</script>
</body>
</html>
